version: "3.9"

services:
  # PostgreSQL database (replaces SQLite for production / Railway parity)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend (uses PostgreSQL; PYTHONPATH set; serves static frontend at root)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://repomind:repomind@db:5432/repomind
      PYTHONPATH: /app
      ENVIRONMENT: production
      JWT_SECRET_KEY: change-me-production-secret-32bytes
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: gpt-3.5-turbo
      FRONTEND_ORIGIN: http://localhost:5173
      CORS_ALLOW_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Static frontend (served independently for full-stack local deploy)
  frontend:
    image: nginx:alpine
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
